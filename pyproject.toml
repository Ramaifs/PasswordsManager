[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-password-manager"
version = "0.35"
license = "LicenseRef-All-Rights-Reserved"
license-files = ["LICENSE.txt", "THIRD_PARTY_NOTICES.md"]
description = "Локальный менеджер паролей для Windows"
requires-python = ">=3.12"
dependencies = ["cryptography>=50,<51", "argon2-cffi>=25,<26", "PySide6>=6.12,<7"]

[project.scripts]
password-manager = "password_manager.app:main"

[project.urls]
Repository = "https://github.com/Ramaifs/PasswordsManager"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
password_manager = ["google-desktop.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
